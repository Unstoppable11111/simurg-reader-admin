version: '1.0'
name: build-and-deploy
displayName: '前端构建与自动化部署'
triggers:
  push:
    branches:
      - dev_001
      - master

stages:
  - name: compile_and_deploy
    displayName: '构建并部署到宝塔'
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_and_deploy
        displayName: 'Node.js 打包与同步'
        nodeVersion: 20.10.0
        commands:
          # 1. 安装 pnpm 并构建产物
          - corepack enable
          - corepack prepare pnpm@latest --activate
          - pnpm install --frozen-lockfile
          - pnpm build
          # 2. 安装 sshpass 传输工具（免在服务器安装任何 Agent）
          - apt-get update && apt-get install -y sshpass
          # 3. 远程同步到宝塔网站目录
          - sshpass -p "$SERVER_PWD" scp -o StrictHostKeyChecking=no -r dist/* root@111.228.38.154:/www/wwwroot/simurg-admin/
          # 4. 远程执行权限修复
          - sshpass -p "$SERVER_PWD" ssh -o StrictHostKeyChecking=no root@111.228.38.154 "chown -R www:www /www/wwwroot/simurg-admin && chmod -R 755 /www/wwwroot/simurg-admin"
          - echo "自动化构建并部署到宝塔成功！"
