version: "1.0"
name: build-and-deploy
displayName: 前端构建与自动化部署
stages:
- name: 构建并部署到宝塔
  displayName: 构建并部署到宝塔
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: build_and_deploy
    displayName: Node.js 打包与同步
    nodeVersion: 24.13.0
    commands:
    - set -e
    - npm install -g pnpm --prefix ~/.local
    - export PATH=~/.local/bin:$PATH
    - pnpm install --frozen-lockfile
    - pnpm build
    - node build/deploy.mjs
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix: []
      precise:
      - dev_001
      - master
      include: []
notify: []
variables:
  global:
  - SERVER_PWD
